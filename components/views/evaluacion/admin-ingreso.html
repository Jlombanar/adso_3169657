<section class="slide portada compacto" id="admin-ingreso" aria-labelledby="admin-ingreso-titulo" hidden><div class="slide-content">
  <div class="portada-tag">🔐 SOLO INSTRUCTOR</div>
  <h1 class="portada-titulo" id="admin-ingreso-titulo">Resultados de la <span class="highlight">evaluación</span></h1>
  <p class="portada-desc">Inicia sesión con la cuenta de admin creada en Supabase.</p>

  <form class="eval-form" id="admin-form" novalidate>
    <label class="eval-campo">
      <span>Correo</span>
      <input id="admin-correo" type="email" autocomplete="username" required>
    </label>
    <label class="eval-campo">
      <span>Contraseña</span>
      <input id="admin-contrasena" type="password" autocomplete="current-password" required>
    </label>
    <p class="eval-error" id="admin-error" role="alert"></p>
    <button class="btn-siguiente" type="submit">Entrar →</button>
  </form>
</div></section>
