<section class="slide compacto" id="eval-preguntas" aria-labelledby="eval-preguntas-titulo" hidden><div class="slide-content">
  <header class="sec-header">
    <span class="sec-tag verde" id="eval-quien"></span>
    <h2 class="sec-titulo" id="eval-preguntas-titulo">Responde todas las preguntas</h2>
    <p class="sec-desc" id="eval-progreso" aria-live="polite">0 de 12 validadas</p>
  </header>

  <form id="eval-cuestionario">
    <!-- evaluacion.js crea aquí un fieldset por pregunta -->
    <ol class="eval-lista" id="eval-lista"></ol>

    <div class="btn-fila"><button class="btn-siguiente" type="submit">Enviar respuestas ✔</button></div>
  </form>
</div></section>
